coilCompose = "3.4.0"
hilt = "2.59.2"
hilt-navigation = "1.3.0"
ksp = "2.3.6"
firebaseBom = "33.1.0"
playServicesAuth = "21.5.1"
room = "2.8.4"
lottie = "6.7.1"
datastorePreferences = "1.2.1"
